name: Déploiement du jeu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# une seule publication à la fois, sans annuler celle en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Tester
        run: dotnet test
      - name: Compiler en Release
        run: dotnet publish src/JeuDeDames.Web -c Release -o publish
      - name: Adapter au sous-chemin GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll
      - uses: actions/configure-pages@v5
      - name: Empaqueter le jeu
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
